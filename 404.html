<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting…</title>
  <script>
    // 현재 경로에서 첫 세그먼트(= 프로젝트 베이스) 추출: "/resume-project"
    (function () {
      var l = window.location;

      // "/resume-project/..." 형태에서 첫 세그먼트만 추출
      var segs = l.pathname.split('/').filter(Boolean);
      var base = segs.length ? '/' + segs[0] : '';

      // 베이스를 제거한 나머지 경로 + 쿼리 + 해시
      var rest = l.pathname.replace(base, '') + l.search + l.hash;

      // "/?p=..." 가 아니라 반드시 "베이스/?p=..." 로 리다이렉트
      // 예) "/resume-project/?p=/main"
      var target = base + '/?p=' + encodeURIComponent(rest);
      l.replace(l.protocol + '//' + l.host + target);
    })();
  </script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; padding: 2rem; color: #333; }
  </style>
</head>
<body>
Redirecting…
</body>
</html>
